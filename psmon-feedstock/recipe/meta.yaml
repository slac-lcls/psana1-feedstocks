{% set name = "psmon" %}
{% set version = "1.0.11" %}

# Recipe recovered from the psmon 1.0.9 package on lcls-i (info/recipe),
# originally from valmar's psana2 feedstocks. Changes:
#   - matplotlib -> matplotlib-base: on Python 3.13, conda-forge's full
#     matplotlib pulls in PySide6/Qt6, which can't coexist with the Qt5
#     (PyQt5) that psana1 needs.
#   - version 1.0.11, built from the git tag.
#   - build number 11, so it ranks above the lcls-ii builds (_0, _10).

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/slaclab/{{ name }}.git
  git_rev: {{ version }}

build:
  noarch: python
  number: 11
  script:
    - "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - pyqtgraph
    - pyzmq
    - numpy
    - matplotlib-base
    - ipython

test:
  imports:
    - psmon

about:
  home: https://github.com/slaclab/psmon
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: 'Data visualization tool for LCLS'
  description: |
    psmon is a remote and local data
    visualization tool used at LCLS for online
    analysis/monitoring developed originally to
    work with LCLS psana analysis framework.
    ZeroMQ is used as the data trasport layer
    and it provides two different rendering
    clients based on matplotlib and pyqtgraph.
  doc_url: https://github.com/slaclab/psmon
  dev_url: https://github.com/slaclab/psmon

extra:
  recipe-maintainers:
    - valmar
    - chrisvam
