channel_sources:
  - lcls-i,conda-forge
channel_targets:
  - lcls-i main

# Glibc floor used by stdlib('c') in meta.yaml (matches production ana-4.0.68-py3).
# Runs on RHEL7, RHEL8 and Rocky 9.
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.17"

# cdt(...) packages in meta.yaml: use the CentOS 7 builds, which match the
# 2.17 sysroot. The default (cos6) needs sysroot 2.12 and conflicts with it.
cdt_name:
  - cos7

# Python 3.13 build. Taken from the 2026-08-04 override in the old
# psana1-feedstock repo (recipe/conda_build_config.yaml.bak); numpy "2"
# instead of 2.0 because NumPy 2.0 has no Python 3.13 builds.
python:
  - 3.13.* *_cpython
python_impl:
  - cpython
numpy:
  - "2"
